name: Materialize Whataburger hero image

# Temporary, same-repo helper: decode the committed .b64 into the news JPEG,
# remove leftover test files, then delete this workflow.
on:
  pull_request:
    branches: [main]

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Decode image, clean temp files, and push
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          src = Path("public/images/news/whataburger-bastrop-reopens-dec-8-sh-71.jpg.b64")
          dest = Path("public/images/news/whataburger-bastrop-reopens-dec-8-sh-71.jpg")
          if src.exists():
              dest.write_bytes(base64.decodebytes(src.read_bytes()))
              src.unlink()
              print(f"wrote {dest} ({dest.stat().st_size} bytes)")
          else:
              print("no b64 payload found")

          for extra in (
              Path("public/images/news/_bincheck.bin"),
              Path(".github/workflows/materialize-whataburger-hero.yml"),
          ):
              if extra.exists():
                  extra.unlink()
                  print(f"removed {extra}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images/news .github/workflows/materialize-whataburger-hero.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add the Whataburger hero JPEG and remove temporary files."
          git push
