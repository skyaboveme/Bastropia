name: Deploy

# A push to main deploys. Content auto-merge also dispatches this workflow
# with the merge commit, because a merge made with the Actions token does
# not create a push workflow run.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy. Leave empty to deploy the selected ref.
        required: false
        type: string

concurrency:
  group: bastropia-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Choose commit
        id: commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
        run: |
          # Branch name, not the event SHA. The job may have waited behind
          # another deploy, and checking out the tip then publishes current
          # main instead of an older commit.
          ref="main"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && printf '%s' "$INPUT_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            ref=$(printf '%s' "$INPUT_SHA" | tr 'A-F' 'a-f')
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Keep the previous build's hashed assets
        run: node scripts/keep-astro-assets.mjs
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aa96f50b9174b128d2cbe8f6db54b940
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set on this repository, so GitHub cannot deploy yet."
            exit 1
          fi
          npx wrangler deploy
      - name: Send HTTP and www to the HTTPS apex
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ensure-https-redirect.mjs
      - name: Seed the social feed
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aa96f50b9174b128d2cbe8f6db54b940
          SOCIAL_FEED_OUT: /tmp/social-feed.json
        run: |
          npx wrangler kv key get social:feed --remote --binding SESSION > /tmp/social-feed-prev.json || true
          SOCIAL_FEED_PREV=/tmp/social-feed-prev.json node --experimental-strip-types scripts/seed-social-feed.ts
          if [ -f /tmp/social-feed.json ]; then
            npx wrangler kv key put social:feed --remote --binding SESSION --path /tmp/social-feed.json
          fi
      - name: Ping IndexNow
        if: success()
        continue-on-error: true
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
        run: node scripts/indexnow.mjs || true
