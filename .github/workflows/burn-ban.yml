name: Burn ban check

on:
  schedule:
    # 13:15 UTC is 7:15 AM CST and 8:15 AM CDT.
    - cron: '15 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the county page and the Forest Service layer
        run: node scripts/check-burn-ban.mjs --write
      - name: Commit a confirmed reading
        run: |
          git add src/data/burnBan.ts src/content/updates/outdoor-burning-status.md
          if git diff --cached --quiet; then
            echo "Burn ban files already match today's reading."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Confirm Bastrop County burn ban status"
          git push
